databases:
  - name: req2test-db
    databaseName: req2test
    user: req2test
    plan: basic-256mb
services:
  - type: web
    name: req2test-api-jayeshpandey21
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m req2test --web --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: req2test-db
          property: connectionString
      - key: APP_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
