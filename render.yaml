services:
  - type: web
    name: req2test-api-jayeshpandey21
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m req2test --web --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
